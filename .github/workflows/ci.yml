name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Keep in step with the header of types/claude-code/index.d.ts; check:types enforces it.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: npm run check:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:scripts
      - run: npm run validate
      - run: npm test
